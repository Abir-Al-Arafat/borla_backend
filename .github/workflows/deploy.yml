name: Deploy Backend (Docker Hybrid)

on:
  push:
    branches:
      - main # Triggers when you push to the main branch

jobs:
  build-and-push:
    name: Build Docker Image and Push to Hub
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # Pulls your repo into the GitHub Runner

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Uses the tag format documented in your Docker guide
          tags: abirwerks/borla-backend:latest

  deploy:
    name: Deploy to EC2
    needs: build-and-push # Ensures deployment only starts if the build succeeds
    runs-on: ubuntu-latest
    steps:
      - name: Execute Remote SSH Commands
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1. Update schema files on host for migration
            cd ~/borla_backend
            git pull origin main # Pulls latest schema and package.json

            # 2. Run Database Migrations on the host
            # This ensures the DB is ready before the new container starts
            npm install --only=dev
            npx prisma generate
            npx prisma db push

            # 3. Docker Login and Cleanup
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

            # Stop the existing container; '|| true' prevents failure if it doesn't exist
            docker stop borla-backend-api || true
            docker rm borla-backend-api || true

            # 4. Pull and Run the New Container
            docker pull abirwerks/borla-backend:latest

            # Maps port 5000 and injects your local .env file[cite: 7]
            docker run -d \
              --name borla-backend-api \
              --restart always \
              -p 5000:5000 \
              --env-file ~/borla_backend/.env \
              abirwerks/borla-backend:latest

            # 5. Verify the container is running
            docker ps | grep borla-backend-api
