apiVersion: v1
kind: ConfigMap
metadata:
  name: borla-backend-config
  namespace: borla-backend
data:
  NODE_ENV: production
  PORT: '5000'
  IP: 0.0.0.0
  SOCKET_PORT: '5000'
  SERVER_URL: http://borla-backend-service.borla-backend.svc.cluster.local:5000
  CLIENT_URL: '*'
  BCRYPT_SALT_ROUNDS: '10'
  JWT_ACCESS_EXPIRES_IN: 1d
  JWT_REFRESH_EXPIRES_IN: 30d
  TERMII_CHANNEL: generic
  ADMIN_MAIL: admin@email.com
